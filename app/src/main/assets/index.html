<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quetta Temp Mail</title>
<style>
  :root {
    --bg: #0b1120;
    --card: #151f32;
    --card-hover: #1e293b;
    --border: #26334d;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #151f32;
    border-bottom: 1px solid var(--border);
    padding: 14px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .brand {
    font-weight: 700;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }
  .dot.err { background: var(--danger); }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin 0.7s linear infinite; }
  .email-box {
    width: 100%;
    background: #090e1a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    font-family: monospace;
    font-size: 0.95rem;
    color: var(--accent);
    margin-bottom: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  button {
    border: 1px solid var(--border);
    background: var(--card-hover);
    color: var(--text);
    padding: 10px 8px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.55; }
  button.primary {
    background: var(--accent);
    color: #090e1a;
    border-color: var(--accent);
  }
  button.danger {
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.4);
  }
  main {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
  }
  main.reading .inbox-pane { display: none; }
  main:not(.reading) .reader-pane { display: none; }
  .pane {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .pane-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .msg-list { list-style: none; overflow-y: auto; flex: 1; }
  .msg-item {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .msg-from {
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .msg-time { font-size: 0.74rem; color: var(--muted); font-weight: 400; }
  .msg-subj { font-size: 0.88rem; margin-bottom: 4px; }
  .msg-prev { font-size: 0.78rem; color: var(--muted); }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    gap: 8px;
  }
  .reader-meta {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
  }
  .reader-subj { font-size: 1.08rem; font-weight: 700; margin: 8px 0; }
  .meta-line { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .meta-line strong { color: var(--text); }
  .view-tabs { display: flex; gap: 6px; margin-top: 10px; }
  .view-tabs button { padding: 6px 12px; font-size: 0.78rem; }
  .view-tabs button.active {
    background: var(--accent);
    color: #090e1a;
    border-color: var(--accent);
  }
  .reader-body {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.92rem;
    line-height: 1.55;
  }
  iframe.html-viewer {
    width: 100%;
    min-height: 400px;
    border: none;
    background: #fff;
    flex: 1;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="brand">⚡ Quetta Temp Mail</div>
    <div class="status-pill">
      <span id="dot" class="dot"></span>
      <span id="statusText">Starting...</span>
    </div>
  </div>
  <div id="emailBox" class="email-box">Initializing...</div>
  <div class="btn-group">
    <button class="primary" onclick="copyEmail()">📋 Copy</button>
    <button onclick="manualRefresh()" id="refreshBtn"><span id="refIcon">🔄</span> Refresh</button>
    <button onclick="rotateEmail()" id="rotateBtn">✨ New Mail</button>
    <button class="danger" onclick="exitApp()">✖ Exit</button>
  </div>
</header>

<main id="mainGrid">
  <section class="pane inbox-pane">
    <div class="pane-header">
      <span>INBOX (<span id="msgCount">0</span>)</span>
      <span style="font-size:0.75rem;">Auto-polls every 2s</span>
    </div>
    <ul id="msgList" class="msg-list"></ul>
    <div id="inboxEmpty" class="empty-state">
      <div style="font-size: 2rem;">📭</div>
      <div>No messages yet</div>
      <div style="font-size: 0.76rem;">Tap Refresh or wait for incoming mail</div>
    </div>
  </section>

  <section class="pane reader-pane">
    <div class="reader-meta">
      <button onclick="closeReader()" style="padding:6px 12px;">← Back to Inbox</button>
      <div id="rSubj" class="reader-subj"></div>
      <div class="meta-line"><strong>From:</strong> <span id="rFrom"></span></div>
      <div class="meta-line"><strong>To:</strong> <span id="rTo"></span></div>
      <div class="meta-line"><strong>Date:</strong> <span id="rDate"></span></div>
      <div class="view-tabs">
        <button id="tabText" class="active" onclick="setMode('text')">Clean Text</button>
        <button id="tabHtml" onclick="setMode('html')">Original HTML</button>
      </div>
    </div>
    <div id="rTextBody" class="reader-body"></div>
    <iframe id="rHtmlFrame" class="html-viewer" sandbox="allow-popups allow-popups-to-escape-sandbox" style="display:none;"></iframe>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
let currentEmail = "";
let messages = [];
let selectedId = null;
let viewMode = "text";

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}

function copyEmail() {
  if (!currentEmail || currentEmail.includes("...")) return;
  if (window.AndroidBridge) {
    window.AndroidBridge.copyEmail(currentEmail);
  }
}

function manualRefresh() {
  const btn = document.getElementById("refreshBtn");
  const icon = document.getElementById("refIcon");
  btn.disabled = true;
  icon.classList.add("spinning");
  setTimeout(() => {
    try {
      const res = JSON.parse(window.AndroidBridge.refreshNow());
      syncState(true);
      if (res.ok) {
        showToast(res.added > 0 ? `Received ${res.added} new email(s)!` : "Inbox is up to date");
      } else {
        showToast("Error: " + res.error);
      }
    } catch (e) {
      showToast("Refresh failed");
    } finally {
      btn.disabled = false;
      icon.classList.remove("spinning");
    }
  }, 50);
}

function rotateEmail() {
  const btn = document.getElementById("rotateBtn");
  btn.disabled = true;
  btn.textContent = "Deleting old...";
  selectedId = null;
  closeReader();
  setTimeout(() => {
    try {
      const res = JSON.parse(window.AndroidBridge.rotateNewMail());
      syncState(true);
      if (res.ok) {
        showToast(`Old deleted! Copied: ${res.email}`);
      } else {
        showToast("Error: " + res.error);
      }
    } catch (e) {
      showToast("Rotation failed");
    } finally {
      btn.disabled = false;
      btn.textContent = "✨ New Mail";
    }
  }, 50);
}

function exitApp() {
  if (confirm("Delete current temp email address and exit app?")) {
    window.AndroidBridge.exitAndCleanup();
  }
}

function renderList() {
  const listEl = document.getElementById("msgList");
  const emptyEl = document.getElementById("inboxEmpty");
  document.getElementById("msgCount").textContent = messages.length;
  if (messages.length === 0) {
    listEl.style.display = "none";
    emptyEl.style.display = "flex";
    return;
  }
  listEl.style.display = "block";
  emptyEl.style.display = "none";
  listEl.innerHTML = "";
  for (const m of messages) {
    const li = document.createElement("li");
    li.className = "msg-item";
    li.onclick = () => selectMessage(m.id);
    li.innerHTML = `
      <div class="msg-from"><span></span><span class="msg-time"></span></div>
      <div class="msg-subj"></div>
      <div class="msg-prev"></div>
    `;
    li.querySelector(".msg-from span:first-child").textContent = m.from;
    li.querySelector(".msg-time").textContent = m.date.slice(11, 19) || m.date;
    li.querySelector(".msg-subj").textContent = (m.hasAttachment ? "📎 " : "") + m.subject;
    li.querySelector(".msg-prev").textContent = m.preview;
    listEl.appendChild(li);
  }
}

function selectMessage(id) {
  selectedId = id;
  const msg = messages.find(x => x.id === id);
  if (!msg) return;
  document.getElementById("mainGrid").classList.add("reading");
  document.getElementById("rSubj").textContent = msg.subject;
  document.getElementById("rFrom").textContent = msg.from;
  document.getElementById("rTo").textContent = msg.to;
  document.getElementById("rDate").textContent = msg.date;
  document.getElementById("rTextBody").textContent = msg.textBody;

  const htmlTab = document.getElementById("tabHtml");
  if (msg.htmlBody) {
    htmlTab.style.display = "inline-flex";
    document.getElementById("rHtmlFrame").srcdoc = msg.htmlBody;
  } else {
    htmlTab.style.display = "none";
    setMode("text");
  }
  updateBodyVisibility();
}

function closeReader() {
  document.getElementById("mainGrid").classList.remove("reading");
}

function setMode(m) {
  viewMode = m;
  document.getElementById("tabText").classList.toggle("active", m === "text");
  document.getElementById("tabHtml").classList.toggle("active", m === "html");
  updateBodyVisibility();
}

function updateBodyVisibility() {
  const isHtml = viewMode === "html";
  document.getElementById("rTextBody").style.display = isHtml ? "none" : "block";
  document.getElementById("rHtmlFrame").style.display = isHtml ? "block" : "none";
}

function syncState(force = false) {
  if (!window.AndroidBridge) return;
  try {
    const d = JSON.parse(window.AndroidBridge.getState());
    currentEmail = d.email;
    document.getElementById("emailBox").textContent = d.email;
    document.getElementById("statusText").textContent = d.error ? d.error : d.status;
    document.getElementById("dot").className = d.error ? "dot err" : "dot";
    const prevLen = messages.length;
    messages = d.messages || [];
    if (force || messages.length !== prevLen) {
      renderList();
    }
  } catch (e) {}
}

setInterval(() => syncState(false), 1200);
syncState(true);
</script>
</body>
</html>
