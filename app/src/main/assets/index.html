<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quetta Temp Mail</title>
<style>
  :root {
    --bg: #070b14;
    --card: #111827;
    --card-hover: #1f2937;
    --border: #263248;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --otp-bg: rgba(34, 197, 94, 0.16);
    --otp-border: #22c55e;
    --otp-text: #4ade80;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #111827;
    border-bottom: 1px solid var(--border);
    padding: 13px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 6px;
  }
  .brand {
    font-weight: 800;
    font-size: 1.04rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.73rem;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
  }
  .dot.err { background: var(--danger); }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin 0.65s linear infinite; }

  .email-box {
    width: 100%;
    background: #050811;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    font-family: monospace;
    font-size: 0.94rem;
    color: var(--accent);
    margin-bottom: 9px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  button {
    border: 1px solid var(--border);
    background: var(--card-hover);
    color: var(--text);
    padding: 10px 6px;
    border-radius: 10px;
    font-size: 0.79rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.55; }
  button.primary {
    background: var(--accent);
    color: #050811;
    border-color: var(--accent);
  }
  button.otp-chip {
    background: var(--otp-bg);
    border-color: var(--otp-border);
    color: var(--otp-text);
    padding: 4px 10px;
    font-size: 0.76rem;
    border-radius: 999px;
  }
  button.danger {
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.4);
  }
  main {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
  }
  main.reading .inbox-pane { display: none; }
  main:not(.reading) .reader-pane { display: none; }
  .pane {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .pane-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search-bar {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .search-bar input {
    width: 100%;
    background: #070b14;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 0.83rem;
    outline: none;
  }
  .msg-list { list-style: none; overflow-y: auto; flex: 1; }
  .msg-item {
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
  }
  .msg-from {
    font-weight: 600;
    font-size: 0.89rem;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .msg-time { font-size: 0.73rem; color: var(--muted); font-weight: 400; }
  .msg-subj { font-size: 0.86rem; margin-bottom: 4px; }
  .msg-prev { font-size: 0.78rem; color: var(--muted); }
  .otp-row { margin-top: 7px; display: flex; gap: 6px; }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    gap: 8px;
  }
  .reader-meta {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.18);
  }
  .reader-top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .reader-subj { font-size: 1.06rem; font-weight: 700; margin: 6px 0; }
  .meta-line { font-size: 0.79rem; color: var(--muted); margin-bottom: 4px; }
  .meta-line strong { color: var(--text); }
  .otp-banner {
    margin-top: 10px;
    padding: 9px 11px;
    border-radius: 10px;
    background: var(--otp-bg);
    border: 1px solid var(--otp-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .view-tabs { display: flex; gap: 6px; margin-top: 10px; }
  .view-tabs button { padding: 6px 12px; font-size: 0.76rem; }
  .view-tabs button.active {
    background: var(--accent);
    color: #050811;
    border-color: var(--accent);
  }
  .reader-body {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 0.91rem;
    line-height: 1.55;
  }
  iframe.html-viewer {
    width: 100%;
    min-height: 400px;
    border: none;
    background: #fff;
    flex: 1;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.81rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="brand">⚡ Quetta Temp Mail</div>
    <div class="status-pill">
      <span id="dot" class="dot"></span>
      <span id="statusText">Starting...</span>
      <span id="lastChecked" style="opacity:0.7;"></span>
    </div>
  </div>
  <div id="emailBox" class="email-box" onclick="copyEmail()">Initializing...</div>
  <div class="btn-group">
    <button class="primary" onclick="copyEmail()">📋 Copy</button>
    <button onclick="manualRefresh()" id="refreshBtn"><span id="refIcon">🔄</span> Refresh</button>
    <button onclick="rotateEmail()" id="rotateBtn">🗑️+✨ New</button>
    <button class="danger" onclick="exitApp()">✖ Exit</button>
  </div>
</header>

<main id="mainGrid">
  <section class="pane inbox-pane">
    <div class="pane-header">
      <span>INBOX (<span id="msgCount">0</span>)</span>
      <button style="padding:4px 8px; font-size:0.72rem;" onclick="enableKeepAlive()">🔋 Keep Alive</button>
    </div>
    <div class="search-bar">
      <input type="search" id="searchInput" placeholder="Search sender, subject, or OTP..." oninput="renderList()">
    </div>
    <ul id="msgList" class="msg-list"></ul>
    <div id="inboxEmpty" class="empty-state">
      <div style="font-size: 2rem;">📭</div>
      <div>No messages yet</div>
      <div style="font-size: 0.75rem;">Foreground Service is watching live in the background</div>
    </div>
  </section>

  <section class="pane reader-pane">
    <div class="reader-meta">
      <div class="reader-top-actions">
        <button onclick="closeReader()" style="padding:6px 12px;">← Back</button>
        <button class="danger" onclick="deleteCurrentEmail()" style="padding:6px 12px;">🗑️ Delete</button>
      </div>
      <div id="rSubj" class="reader-subj"></div>
      <div class="meta-line"><strong>From:</strong> <span id="rFrom"></span></div>
      <div class="meta-line"><strong>To:</strong> <span id="rTo"></span></div>
      <div class="meta-line"><strong>Date:</strong> <span id="rDate"></span></div>

      <div id="rOtpBanner" class="otp-banner" style="display:none;">
        <strong style="color:var(--otp-text);">🔑 Code: <span id="rOtpValue" style="font-family:monospace;"></span></strong>
        <div style="display:flex; gap:6px;">
          <button class="otp-chip" onclick="copyDetectedOtp()">Copy Code</button>
          <a id="rVerifyLink" href="#" style="color:var(--accent); font-size:0.78rem; align-self:center; display:none;">🔗 Verify Link</a>
        </div>
      </div>

      <div class="view-tabs">
        <button id="tabText" class="active" onclick="setMode('text')">Clean Text</button>
        <button id="tabHtml" onclick="setMode('html')">Original HTML</button>
      </div>
    </div>
    <div id="rTextBody" class="reader-body"></div>
    <iframe id="rHtmlFrame" class="html-viewer" sandbox="allow-popups allow-popups-to-escape-sandbox" style="display:none;"></iframe>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
let currentEmail = "";
let messages = [];
let selectedId = null;
let viewMode = "text";

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}

function copyEmail() {
  if (!currentEmail || currentEmail.includes("...")) return;
  if (window.AndroidBridge) {
    window.AndroidBridge.copyText(currentEmail, "address");
  }
}

function copyDetectedOtp() {
  const msg = messages.find(x => x.id === selectedId);
  if (msg && msg.otp && window.AndroidBridge) {
    window.AndroidBridge.copyText(msg.otp, "OTP");
  }
}

function enableKeepAlive() {
  if (window.AndroidBridge) {
    window.AndroidBridge.requestUnrestrictedBattery();
  }
}

function manualRefresh() {
  const btn = document.getElementById("refreshBtn");
  const icon = document.getElementById("refIcon");
  btn.disabled = true;
  icon.classList.add("spinning");
  if (window.AndroidBridge) {
    window.AndroidBridge.refreshNow();
  }
}

window.onRefreshComplete = function(ok, added, err) {
  document.getElementById("refreshBtn").disabled = false;
  document.getElementById("refIcon").classList.remove("spinning");
  syncState(true);
  if (ok) {
    showToast(added > 0 ? `Received ${added} new email(s)!` : "Inbox is up to date");
  } else {
    showToast("Error: " + (err || "Failed"));
  }
};

function rotateEmail() {
  const btn = document.getElementById("rotateBtn");
  btn.disabled = true;
  btn.textContent = "Deleting old...";
  selectedId = null;
  closeReader();
  if (window.AndroidBridge) {
    window.AndroidBridge.rotateNewMail();
  }
}

window.onRotateComplete = function(ok, emailOrErr, delCount) {
  const btn = document.getElementById("rotateBtn");
  btn.disabled = false;
  btn.textContent = "🗑️+✨ New";
  syncState(true);
  if (ok) {
    showToast(`Old deleted! Copied: ${emailOrErr}`);
  } else {
    showToast("Error: " + emailOrErr);
  }
};

function deleteCurrentEmail() {
  if (!selectedId) return;
  const id = selectedId;
  selectedId = null;
  closeReader();
  if (window.AndroidBridge) {
    window.AndroidBridge.deleteEmail(id);
  }
  showToast("Email deleted");
}

function exitApp() {
  if (confirm("Delete current temp email address and stop background service?")) {
    window.AndroidBridge.exitAndCleanup();
  }
}

function renderList() {
  const listEl = document.getElementById("msgList");
  const emptyEl = document.getElementById("inboxEmpty");
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  const filtered = messages.filter(m =>
    !q ||
    m.from.toLowerCase().includes(q) ||
    m.subject.toLowerCase().includes(q) ||
    m.textBody.toLowerCase().includes(q) ||
    (m.otp && m.otp.includes(q))
  );

  document.getElementById("msgCount").textContent = messages.length;
  if (filtered.length === 0) {
    listEl.style.display = "none";
    emptyEl.style.display = "flex";
    return;
  }
  listEl.style.display = "block";
  emptyEl.style.display = "none";
  listEl.innerHTML = "";
  for (const m of filtered) {
    const li = document.createElement("li");
    li.className = "msg-item";
    li.onclick = () => selectMessage(m.id);
    li.innerHTML = `
      <div class="msg-from"><span></span><span class="msg-time"></span></div>
      <div class="msg-subj"></div>
      <div class="msg-prev"></div>
    `;
    li.querySelector(".msg-from span:first-child").textContent = m.from;
    li.querySelector(".msg-time").textContent = m.date.slice(11, 19) || m.date;
    li.querySelector(".msg-subj").textContent = (m.hasAttachment ? "📎 " : "") + m.subject;
    li.querySelector(".msg-prev").textContent = m.preview;

    if (m.otp) {
      const otpRow = document.createElement("div");
      otpRow.className = "otp-row";
      const chip = document.createElement("button");
      chip.className = "otp-chip";
      chip.textContent = "🔑 Copy OTP: " + m.otp;
      chip.onclick = (ev) => {
        ev.stopPropagation();
        window.AndroidBridge.copyText(m.otp, "OTP");
      };
      otpRow.appendChild(chip);
      li.appendChild(otpRow);
    }
    listEl.appendChild(li);
  }
}

function selectMessage(id) {
  selectedId = id;
  const msg = messages.find(x => x.id === id);
  if (!msg) return;
  document.getElementById("mainGrid").classList.add("reading");
  document.getElementById("rSubj").textContent = msg.subject;
  document.getElementById("rFrom").textContent = msg.from;
  document.getElementById("rTo").textContent = msg.to;
  document.getElementById("rDate").textContent = msg.date;
  document.getElementById("rTextBody").textContent = msg.textBody;

  const otpBanner = document.getElementById("rOtpBanner");
  const verifyLink = document.getElementById("rVerifyLink");
  if (msg.otp || msg.verifyLink) {
    otpBanner.style.display = "flex";
    document.getElementById("rOtpValue").textContent = msg.otp || "Link";
    if (msg.verifyLink) {
      verifyLink.style.display = "inline";
      verifyLink.href = msg.verifyLink;
    } else {
      verifyLink.style.display = "none";
    }
  } else {
    otpBanner.style.display = "none";
  }

  const htmlTab = document.getElementById("tabHtml");
  if (msg.htmlBody) {
    htmlTab.style.display = "inline-flex";
    document.getElementById("rHtmlFrame").srcdoc = msg.htmlBody;
  } else {
    htmlTab.style.display = "none";
    setMode("text");
  }
  updateBodyVisibility();
}

function closeReader() {
  document.getElementById("mainGrid").classList.remove("reading");
}

function setMode(m) {
  viewMode = m;
  document.getElementById("tabText").classList.toggle("active", m === "text");
  document.getElementById("tabHtml").classList.toggle("active", m === "html");
  updateBodyVisibility();
}

function updateBodyVisibility() {
  const isHtml = viewMode === "html";
  document.getElementById("rTextBody").style.display = isHtml ? "none" : "block";
  document.getElementById("rHtmlFrame").style.display = isHtml ? "block" : "none";
}

function applyStateObj(d, force = false) {
  currentEmail = d.email;
  document.getElementById("emailBox").textContent = d.email;
  document.getElementById("statusText").textContent = d.error ? d.error : d.status;
  document.getElementById("lastChecked").textContent = d.lastChecked && d.lastChecked !== "-" ? `• ${d.lastChecked}` : "";
  document.getElementById("dot").className = d.error ? "dot err" : "dot";
  const prevLen = messages.length;
  messages = d.messages || [];
  if (force || messages.length !== prevLen) {
    renderList();
  }
}

window.onNativePush = function(event, rawJson) {
  try {
    const d = JSON.parse(rawJson);
    applyStateObj(d, true);
  } catch (e) {}
};

function syncState(force = false) {
  if (!window.AndroidBridge) return;
  try {
    const d = JSON.parse(window.AndroidBridge.getState());
    applyStateObj(d, force);
  } catch (e) {}
}

setInterval(() => syncState(false), 2000);
syncState(true);
</script>
</body>
</html>
